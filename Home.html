<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Performance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            text-align: center;
            color: #243b64;
        }

        .student {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            flex: 1;
            text-align: center;
            padding: 18px 8px;
            background: #eaf1ff;
            border-radius: 8px;
        }

        .card h2 {
            color: #2457c5;
            margin: 5px;
        }

        .progress {
            background: #ddd;
            height: 22px;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar {
            width: 85%;
            height: 100%;
            background: #28a745;
            text-align: center;
            color: white;
            line-height: 22px;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #218838;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #243b64;
            color: white;
        }

        @media (max-width: 500px) {
            .stats {
                flex-direction: column;
            }

            body {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Attendance Performance</h1>

        <div class="student">
            <h3>Student Name: Chirag Prajapati</h3>
            <p>Course: B.Tech Computer Engineering</p>
        </div>

        <div class="stats">
            <div class="card">
                <p>Total Classes</p>
                <h2>100</h2>
            </div>

            <div class="card">
                <p>Present</p>
                <h2>85</h2>
            </div>

            <div class="card">
                <p>Absent</p>
                <h2>15</h2>
            </div>
        </div>

        <h3>Overall Attendance: 85%</h3>

        <div class="progress">
            <div class="bar">85%</div>
        </div>

        <p class="status">Good Attendance Performance</p>

        <table>
            <tr>
                <th>Subject</th>
                <th>Total Classes</th>
                <th>Present</th>
                <th>Attendance</th>
            </tr>

            <tr>
                <td>HTML</td>
                <td>30</td>
                <td>27</td>
                <td>90%</td>
            </tr>

            <tr>
                <td>Python</td>
                <td>40</td>
                <td>32</td>
                <td>80%</td>
            </tr>

            <tr>
                <td>Data Structures</td>
                <td>30</td>
                <td>26</td>
                <td>86.67%</td>
            </tr>
        </table>
    </div>
</body>
</html>
